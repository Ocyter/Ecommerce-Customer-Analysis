name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and check portfolio evidence
        run: |
          python3 -m pip install --disable-pip-version-check "reportlab>=4,<5" "pypdf>=5,<7" "pymupdf>=1.25,<2"
          python3 case-studies/sql-data-quality/run_demo.py
          git diff --exit-code -- case-studies/sql-data-quality/outputs/
          python3 case-studies/sql-data-quality/power-bi/build_project.py
          python3 case-studies/public-data/check_outputs.py
          python3 case-studies/public-data/render.py
          git diff --exit-code -- case-studies/public-data/bikeshare/index.html case-studies/public-data/retail/index.html
          python3 tools/build_cv_pdf.py
          python3 tools/validate_portfolio.py
          python3 tools/render_cv_previews.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
